# ParadeDB = Postgres + pgvector (vector search) + pg_search (real BM25 via
# Tantivy). One database holds the vector index, the lexical index, chat
# history, and feedback. The subject allows OpenSearch/Tantivy/sqlite-fts for
# the lexical arm; pg_search IS Tantivy, embedded in Postgres -- so we get
# genuine BM25 scoring without running a second datastore.
services:
  # The application itself, so nothing needs installing on the host.
  # Inside the compose network services reach each other by NAME (db, ollama),
  # not localhost -- localhost inside a container is that container.
  app:
    build: .
    container_name: rag-app
    ports:
      # Host 8502, container 8501: 8501 is Streamlit's default and is often
      # already taken by another app on a developer machine. Override with
      # APP_PORT in .env if 8502 clashes too.
      - "${APP_PORT:-8502}:8501"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      OLLAMA_URL: http://ollama:11434
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
    volumes:
      # Your documents, read-only: the app never writes to the corpus.
      - ./corpus:/app/corpus:ro
      - ./data:/app/data
      - ./eval:/app/eval
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: paradedb/paradedb:latest
    container_name: rag-db
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ expects the volume at /var/lib/postgresql (not .../data),
      # so pg_upgrade can work across a single mount point.
      - rag-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Local LLM: runs rerank / query-rewrite / answers / eval-judge with no API
  # key and no cost, when LLM_PROVIDER=ollama.
  #     make ollama-up
  #
  # Docker on macOS has no GPU passthrough, so this runs on CPU -- roughly
  # 10-90s per answer. Install Ollama natively for Metal acceleration if you
  # need it responsive; the app talks to the same URL either way.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: rag-ollama
    ports:
      - "11434:11434"
    volumes:
      - rag-ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  rag-pgdata:
  rag-ollama:
