<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internal Knowledge Assistant</title>
<style>
  :root{
    --bg:#fbfaf8; --panel:#fff; --line:#e5e1da; --ink:#1c1a17; --muted:#6b655c;
    --accent:#8a4b2a; --accent-soft:#f4ece6; --good:#2f6f4f; --bad:#a33a2a;
    --radius:10px; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#16150f;--panel:#1e1c17;--line:#332f27;--ink:#ece7dd;--muted:#9a9184;
          --accent:#d38b5d;--accent-soft:#2a231c;}
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.6 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
       background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);
         background:var(--panel);color:var(--ink);padding:7px 13px}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  input,textarea,select{font:inherit;padding:9px 11px;border:1px solid var(--line);
        border-radius:8px;background:var(--panel);color:var(--ink);width:100%}
  a{color:var(--accent)}

  header{display:flex;align-items:center;gap:12px;padding:10px 18px;
         border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:650;letter-spacing:-.01em}
  .spacer{flex:1}
  .meter{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

  #layout{flex:1;display:flex;min-height:0}
  aside{width:230px;border-right:1px solid var(--line);background:var(--panel);
        overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
  aside .conv{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;
        color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  aside .conv:hover{background:var(--accent-soft)}
  aside .conv.active{background:var(--accent-soft);color:var(--ink);font-weight:600}

  main{flex:1;display:flex;flex-direction:column;min-width:0}
  #thread{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:18px}
  .msg{max-width:760px;width:100%;margin:0 auto}
  .role{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
        margin-bottom:5px}
  .bubble{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
          padding:13px 15px;white-space:pre-wrap;overflow-wrap:anywhere}
  .msg.user .bubble{background:var(--accent-soft);border-color:transparent}
  .refused .bubble{border-left:3px solid var(--muted)}
  .warn{border-left:3px solid var(--bad)!important}

  .cites{margin-top:9px;display:flex;flex-wrap:wrap;gap:6px}
  .cite{font:11px/1.5 var(--mono);padding:3px 8px;border:1px solid var(--line);
        border-radius:99px;text-decoration:none;color:var(--muted);background:var(--panel)}
  .cite:hover{border-color:var(--accent);color:var(--accent)}
  .cite.invalid{border-color:var(--bad);color:var(--bad)}

  details.sources{margin-top:9px;font-size:12px;color:var(--muted)}
  details.sources pre{font:11px/1.5 var(--mono);white-space:pre-wrap;
        background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px;margin:6px 0}
  .fb{margin-top:9px;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
  .fb button{padding:3px 9px;font-size:13px;line-height:1}
  .fb button.on{background:var(--accent-soft);border-color:var(--accent)}

  footer{border-top:1px solid var(--line);background:var(--panel);padding:12px 18px}
  .composer{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
  .composer textarea{resize:none;min-height:44px;max-height:180px}
  .filters{max-width:760px;margin:0 auto 8px;display:flex;gap:8px;align-items:center;
           font-size:12px;color:var(--muted)}
  .filters select{width:auto;padding:4px 8px;font-size:12px}

  #gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:20px;z-index:9}
  #gate .card{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);
              border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:11px}
  .err{color:var(--bad);font-size:13px;min-height:18px}
  .hint{font-size:12px;color:var(--muted)}
  .hidden{display:none!important}
</style>
</head>
<body>

<div id="gate">
  <form class="card" id="authForm">
    <h1 style="margin:0 0 2px;font-size:17px">Internal Knowledge Assistant</h1>
    <div class="hint">Answers from your internal documents, with citations.</div>
    <input id="email" type="email" placeholder="you@company.com" autocomplete="username" required>
    <input id="password" type="password" placeholder="password (8+ characters)"
           autocomplete="current-password" minlength="8" required>
    <div class="err" id="authErr"></div>
    <button class="primary" id="loginBtn" type="submit">Sign in</button>
    <button type="button" id="signupBtn">Create account</button>
  </form>
</div>

<header class="hidden" id="topbar">
  <h1>Knowledge Assistant</h1>
  <span class="meter" id="meter"></span>
  <span class="spacer"></span>
  <a id="adminLink" class="hidden" href="/admin"><button type="button">Feedback</button></a>
  <button id="newBtn" type="button">New chat</button>
  <button id="logoutBtn" type="button">Sign out</button>
</header>

<div id="layout" class="hidden">
  <aside id="sidebar"></aside>
  <main>
    <div id="thread"></div>
    <footer>
      <div class="filters">
        <label for="sourceSel">Source</label>
        <select id="sourceSel"><option value="">All sources</option></select>
        <span id="status"></span>
      </div>
      <form class="composer" id="askForm">
        <textarea id="q" rows="1" placeholder="Ask about internal docs…  (Enter to send)"></textarea>
        <button class="primary" type="submit" id="sendBtn">Ask</button>
      </form>
    </footer>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
let conversationId = null, me = null, streaming = false;

const api = async (path, opts = {}) => {
  const r = await fetch(path, {headers:{"Content-Type":"application/json"}, ...opts});
  if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || r.statusText);
  return r.json();
};

// -- auth -------------------------------------------------------------
async function boot(){
  try { me = await api("/api/me"); } catch { return; }
  $("#gate").classList.add("hidden");
  $("#topbar").classList.remove("hidden");
  $("#layout").classList.remove("hidden");
  if (me.is_admin) $("#adminLink").classList.remove("hidden");
  updateMeter();
  if (!me.llm_available)
    setStatus("No API key configured — retrieval runs, answers are refused.");
  await Promise.all([loadConversations(), loadSources()]);
}
function updateMeter(){
  if (!me) return;
  $("#meter").textContent =
    `${me.questions_used}/${me.questions_limit} questions · ` +
    `$${(me.cents_used/100).toFixed(2)}/$${(me.cents_limit/100).toFixed(2)} today`;
}
const setStatus = t => $("#status").textContent = t || "";

$("#authForm").addEventListener("submit", e => { e.preventDefault(); auth("/api/login"); });
$("#signupBtn").addEventListener("click", () => auth("/api/signup"));
async function auth(path){
  $("#authErr").textContent = "";
  try {
    await api(path, {method:"POST", body: JSON.stringify(
      {email:$("#email").value, password:$("#password").value})});
    await boot();
  } catch (e) { $("#authErr").textContent = e.message; }
}
$("#logoutBtn").addEventListener("click", async () => {
  await api("/api/logout", {method:"POST"}); location.reload();
});

// -- conversations ----------------------------------------------------
async function loadConversations(){
  const convs = await api("/api/conversations");
  $("#sidebar").innerHTML = "";
  for (const c of convs){
    const el = document.createElement("div");
    el.className = "conv" + (c.id === conversationId ? " active" : "");
    el.textContent = c.title;
    el.onclick = () => openConversation(c.id);
    $("#sidebar").appendChild(el);
  }
}
async function openConversation(id){
  conversationId = id;
  const {messages} = await api(`/api/conversations/${id}`);
  $("#thread").innerHTML = "";
  for (const m of messages){
    if (m.role === "user") addMessage("user", m.content);
    else {
      const node = addMessage("assistant", m.content, m.refused);
      renderCitations(node, m.citations || []);
      addFeedback(node, m.id, m.rating);
    }
  }
  await loadConversations();
}
$("#newBtn").addEventListener("click", () => {
  conversationId = null; $("#thread").innerHTML = ""; loadConversations();
});

async function loadSources(){
  for (const s of await api("/api/sources")){
    const o = document.createElement("option"); o.value = o.textContent = s;
    $("#sourceSel").appendChild(o);
  }
}

// -- rendering --------------------------------------------------------
const escape = s => s.replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function addMessage(role, text = "", refused = false){
  const wrap = document.createElement("div");
  wrap.className = `msg ${role}` + (refused ? " refused" : "");
  wrap.innerHTML = `<div class="role">${role === "user" ? "You" : "Assistant"}</div>
                    <div class="bubble"></div>`;
  wrap.querySelector(".bubble").textContent = text;
  $("#thread").appendChild(wrap);
  $("#thread").scrollTop = $("#thread").scrollHeight;
  return wrap;
}

// Turn [chunk-id] into a clickable link. Only ids the server marked valid
// become links -- a fabricated citation stays plain text so it is visibly
// not a source.
function renderAnswer(node, text, citations){
  const byId = Object.fromEntries(citations.map(c => [c.chunk_id, c]));
  node.querySelector(".bubble").innerHTML = escape(text).replace(
    /\[([A-Za-z0-9_.\/#-]+?#c\d{4})\]/g,
    (m, id) => {
      const c = byId[id];
      return (c && c.valid && c.url)
        ? `<a class="cite" href="${c.url}" target="_blank" rel="noopener">${id}</a>`
        : `<span class="cite invalid" title="not in retrieved context">${id}</span>`;
    });
}

function renderCitations(node, citations){
  if (!citations.length) return;
  const bad = citations.filter(c => !c.valid);
  if (bad.length) node.querySelector(".bubble").classList.add("warn");
  const box = document.createElement("div");
  box.className = "cites";
  for (const c of citations){
    const el = document.createElement(c.valid && c.url ? "a" : "span");
    el.className = "cite" + (c.valid ? "" : " invalid");
    el.textContent = c.source || c.chunk_id;
    if (c.valid && c.url){ el.href = c.url; el.target = "_blank"; el.rel = "noopener"; }
    else el.title = "cited but not in the retrieved context";
    box.appendChild(el);
  }
  node.appendChild(box);
}

function renderRetrieval(node, chunks, queries){
  const d = document.createElement("details");
  d.className = "sources";
  d.innerHTML = `<summary>${chunks.length} passages retrieved</summary>`;
  if (queries && queries.length > 1)
    d.innerHTML += `<div class="hint">searched: ${queries.map(escape).join(" · ")}</div>`;
  for (const c of chunks){
    const p = document.createElement("pre");
    const score = c.rerank_score != null ? ` · ${c.rerank_score}/10` : "";
    p.textContent = `${c.chunk_id} [${(c.found_by||[]).join("+")}${score}]\n`
                  + `${(c.heading_trail||[]).join(" > ")}\n\n${c.snippet}`;
    d.appendChild(p);
  }
  node.appendChild(d);
}

function addFeedback(node, messageId, rating){
  const box = document.createElement("div");
  box.className = "fb";
  box.innerHTML = `<button type="button" data-r="1">👍</button>
                   <button type="button" data-r="-1">👎</button>
                   <span class="hint"></span>`;
  const mark = r => box.querySelectorAll("button").forEach(
    b => b.classList.toggle("on", Number(b.dataset.r) === r));
  if (rating) mark(rating);
  box.querySelectorAll("button").forEach(b => b.onclick = async () => {
    const r = Number(b.dataset.r);
    let comment = "";
    if (r === -1) comment = prompt("What was wrong with this answer? (optional)") || "";
    await api("/api/feedback", {method:"POST",
      body: JSON.stringify({message_id: messageId, rating: r, comment})});
    mark(r);
    box.querySelector(".hint").textContent = "thanks — recorded";
  });
  node.appendChild(box);
}

// -- ask (SSE over POST) ----------------------------------------------
$("#q").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); $("#askForm").requestSubmit(); }
});
$("#q").addEventListener("input", e => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 180) + "px";
});

$("#askForm").addEventListener("submit", async e => {
  e.preventDefault();
  const question = $("#q").value.trim();
  if (!question || streaming) return;
  streaming = true; $("#sendBtn").disabled = true; setStatus("searching…");
  $("#q").value = ""; $("#q").style.height = "auto";
  addMessage("user", question);
  const node = addMessage("assistant", "");
  const bubble = node.querySelector(".bubble");

  const source = $("#sourceSel").value;
  const res = await fetch("/api/ask", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({question, conversation_id: conversationId,
                          sources: source ? [source] : null}),
  });
  if (!res.ok){
    bubble.textContent = (await res.json().catch(()=>({}))).detail || "request failed";
    node.querySelector(".bubble").classList.add("warn");
    streaming = false; $("#sendBtn").disabled = false; setStatus(""); return;
  }

  const reader = res.body.getReader(), decoder = new TextDecoder();
  let buffer = "", answer = "", chunks = [], queries = [];
  while (true){
    const {done, value} = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, {stream:true});
    const frames = buffer.split("\n\n"); buffer = frames.pop();
    for (const frame of frames){
      const ev = /event: (.*)/.exec(frame)?.[1];
      const data = JSON.parse(/data: (.*)/s.exec(frame)?.[1] || "{}");
      if (ev === "start"){ conversationId = data.conversation_id; setStatus("thinking…"); }
      else if (ev === "retrieval"){
        chunks = data.chunks; queries = data.queries_used;
        setStatus(`${chunks.length} passages`);
        if (data.notes?.length) setStatus(data.notes.join("; "));
      }
      else if (ev === "token"){ answer += data.text; bubble.textContent = answer;
        $("#thread").scrollTop = $("#thread").scrollHeight; }
      else if (ev === "error"){ bubble.textContent = answer + "\n\n" + data.detail;
        bubble.classList.add("warn"); }
      else if (ev === "done"){
        if (data.refused) node.classList.add("refused");
        renderAnswer(node, answer, data.citations);
        renderCitations(node, data.citations);
        renderRetrieval(node, chunks, queries);
        addFeedback(node, data.message_id, null);
        if (data.invalid_citations?.length)
          setStatus(`⚠ ${data.invalid_citations.length} citation(s) not in retrieved context`);
        else setStatus("");
        me = await api("/api/me"); updateMeter(); loadConversations();
      }
    }
  }
  streaming = false; $("#sendBtn").disabled = false;
});

boot();
</script>
</body>
</html>
